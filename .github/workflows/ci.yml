name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The full suite (file-pipelines e2e + production image smoke) needs more
    # than the old 15-minute ceiling; a cold GHA cache can push a main run past
    # 20 minutes, so leave headroom.
    timeout-minutes: 45
    env:
      # A missing browser or system tool must fail the job instead of silently
      # skipping tests (packages/test-kit honors these).
      REQUIRE_BROWSER: "1"
      REQUIRE_TEST_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Match the production image's node:latest tag (currently Node 26;
          # future Node majors arrive automatically).
          node-version: 'latest'
          cache: npm

      - name: Install test system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libimage-exiftool-perl age python3-venv

      - name: Show runtime versions
        run: |
          node --version
          npm --version
          node -p "'Node ' + process.versions.node + ' (LTS: ' + (process.release.lts || 'no') + ')'"
          ffmpeg -version | head -1
          exiftool -ver
          age --version

      - run: npm ci
      - run: npm run lint
      - run: npm run check:html

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Reject skipped tests
        # The suite must not green-by-skip. REQUIRE_TEST_TOOLS/REQUIRE_BROWSER
        # already throw for missing tools; this also catches any
        # platform-conditional skip that sneaks in later.
        run: |
          if grep -q '# SKIP' test-output.log; then
            echo "::error::Tests were skipped; install the missing tool or fix the test."
            grep '# SKIP' test-output.log
            exit 1
          fi

      - name: Python downloader smoke
        run: |
          python3 -m venv /tmp/ytmusic-venv
          /tmp/ytmusic-venv/bin/pip install --disable-pip-version-check -q \
            -r apps/task-runner/tools/ytmusic/downloader/requirements.txt
          /tmp/ytmusic-venv/bin/python - <<'PY'
          from importlib.metadata import version

          import yt_dlp
          import ytmusicapi
          from dotenv import load_dotenv

          assert ytmusicapi
          assert yt_dlp
          assert load_dotenv
          print("ytmusicapi", version("ytmusicapi"))
          print("yt-dlp", version("yt-dlp"))
          print("python-dotenv", version("python-dotenv"))
          PY

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build unified app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: dscpln-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: dscpln-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - name: Smoke test production images
        env:
          # buildx loaded the images into Docker's store; podman is also
          # installed on the runner and would look in a different store.
          ENGINE: docker
        run: bash scripts/smoke-image.sh dscpln-app:ci dscpln-agent:ci

  publish:
    needs: test
    # Publish only from main after tests pass. workflow_dispatch is an escape
    # hatch for re-publishing; dispatch it from main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize pushes so two merges cannot race :latest. A newer pending run
    # replaces an older pending one, so the last main build always wins.
    concurrency:
      group: publish-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: images
        env:
          # Keep one registry/org/tag source of truth with the local scripts.
          IMAGE_ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          source scripts/images.sh
          REGISTRY="$DEFAULT_REGISTRY"
          # Docker references are lowercase; GitHub owners are case-insensitive.
          IMAGE_ORG="${IMAGE_ORG:-$DEFAULT_IMAGE_ORG}"
          IMAGE_ORG="${IMAGE_ORG,,}"
          {
            echo "tags<<EOF"
            for app in "${ALL_APPS[@]}"; do
              printf '%s/%s/%s:latest\n' "$REGISTRY" "$IMAGE_ORG" "${IMAGE_NAMES[$app]}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "agent_tag=${REGISTRY}/${IMAGE_ORG}/${AGENT_IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent
        id: build-agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.agent_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - name: Verify tags and record digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          AGENT_DIGEST: ${{ steps.build-agent.outputs.digest }}
          TAGS: ${{ steps.images.outputs.tags }}
          AGENT_TAG: ${{ steps.images.outputs.agent_tag }}
        run: |
          set -euo pipefail
          source scripts/images.sh
          [ -n "$DIGEST" ] || { echo "Error: build produced no digest" >&2; exit 1; }
          [ -n "$AGENT_DIGEST" ] || { echo "Error: agent build produced no digest" >&2; exit 1; }

          {
            echo "## Published images"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "| App | Pinned reference |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          : > image-digests.txt
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            actual="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$DIGEST" ]; then
              echo "Error: $tag resolves to $actual, expected $DIGEST" >&2
              exit 1
            fi
            pinned="${tag}@${DIGEST}"
            printf 'image: %s\n' "$pinned" | tee -a image-digests.txt
            app="${tag##*/}"
            app="${app%%:*}"
            echo "| \`${app}\` | \`${pinned}\` |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"

          agent_actual="$(docker buildx imagetools inspect "$AGENT_TAG" --format '{{.Manifest.Digest}}')"
          if [ "$agent_actual" != "$AGENT_DIGEST" ]; then
            echo "Error: $AGENT_TAG resolves to $agent_actual, expected $AGENT_DIGEST" >&2
            exit 1
          fi
          agent_pinned="${AGENT_TAG}@${AGENT_DIGEST}"
          printf 'image: %s\n' "$agent_pinned" | tee -a image-digests.txt
          echo "| \`${AGENT_IMAGE}\` | \`${agent_pinned}\` |" >> "$GITHUB_STEP_SUMMARY"

          {
            echo
            echo "Unified digest: \`${DIGEST}\`"
            echo
            echo "Agent digest: \`${AGENT_DIGEST}\`"
            echo
            echo "Deployments pin these digests; this run does not deploy anything."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest table
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests.txt
          if-no-files-found: error
          # Re-running the publish job reuses the run's artifact name.
          overwrite: true
