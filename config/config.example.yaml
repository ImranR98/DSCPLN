# Example backup config — a schema reference documenting every field and
# capability with generic examples. Your real values live in config.yaml.
#
# Top-level values are referenced from tasks as {{token}} (e.g. {{backup_root}}).
# Values may reference other tokens (e.g. '{{backup_root}}/Documents').
# A built-in token {{repo_dir}} resolves to this repository's root (set via
# the BACKUPCTL_REPO_DIR env var when not running from a checkout).
# Built-in per-run tokens: {{uploads}} (quoted staged file paths),
# {{tmp}} (unique temp path), {{python}} (the server's interpreter).
# Every task needs either `dest:` or `state_dir:` — run state is stored there
# as .backup-state-<task>.json (excluded from git commits).
#
# Every task is a bash command. Simple tasks call backupctl/lib.sh (the
# built-in {{lib}} token) as a subcommand (move/copy/encrypt); anything with
# logic sources it inside a bash heredoc and uses its functions
# (bctl_extract, bctl_rsync, bctl_git_commit, bctl_process_and_move, ...).
# Task fields:
#   uploads: true + glob:   drop zone on the card; glob may be a list
#   prompts:                confirm/secret dialogs (values usable as {{key}})
#   require: [key...]       fail unless each prompt key has a value
#   capture + commit_dir    output shown in a copy/paste dialog
#   tool/fresh_dir/prune    CLI download, post-run validation, old-export prune
#   root:                   source dir the card requires (availability badge)
#   summary_last_line       card summary = last log line
#   timeout, cwd, note, export_url

# ---------- machine-specific values -----------------------------------------

backup_root: ~/Backups                          # where backup data lives
sync_dir: ~/Sync                                # source root for device tasks (task field `root`)
scriptroot: '{{repo_dir}}/scripts'              # git submodules with personal scripts
media_staging_dir: ~/Downloads/MediaStaging
raw_media_dir: ~/Downloads/RawMedia
dns_export_file: '<dns export filename>'

# Personal scripts kept as submodules under {{scriptroot}}:
balance_script: '{{scriptroot}}/<balance repo>/<script>.js'
balance_dir: '{{scriptroot}}/<balance repo>'
notes_dir: '{{backup_root}}/Notes'
notes_glob: '<notes file glob>'
spreadsheet_xlsx: '{{backup_root}}/Documents/<spreadsheet>.xlsx'
chat_merge_script: '{{scriptroot}}/<chat txt repo>/<script>.js'

hosts:
  gaming_pc:              # used by the ssh/rsync example
    user: <user>
    host: <host>
    port: 22
  fileserver:
    user: <user>
    host: <host>
    data_path: /home/<user>/<data dir>

mail_email: you@example.com


# ---------- task definitions ------------------------------------------------

tasks:

  # move subcommand: drop files, they are moved into dest (optionally under
  # one fixed name) and dest is git-committed.
  - name: Bookmarks
    group: Apps & Accounts
    uploads: true
    glob: 'bookmarks_*.html'
    state_dir: '{{backup_root}}/Manual'
    summary_last_line: true
    note: Drop the bookmarks export (HTML) here.
    command: "bash '{{lib}}' move --rename bookmarks.html '{{backup_root}}/Manual' {{uploads}}"

  # A group of related exports in one card: a heredoc script matches each
  # dropped file by name and renames it per pattern.
  - name: Contacts + Calendar
    group: Apps & Accounts
    uploads: true
    glob: ['contacts-*.vcf', 'todo-*.ics']
    state_dir: '{{backup_root}}/Manual'
    summary_last_line: true
    note: Drop the contacts (VCF) and calendar (ICS) exports here.
    command: |
      bash <<'BASH_SCRIPT'
      source '{{lib}}'
      DEST='{{backup_root}}/Manual'
      mkdir -p "$DEST"
      for f in {{uploads}}; do
        case "$(basename "$f")" in
          contacts-*.vcf) mv "$f" "$DEST/My Contacts.vcf" ;;
          todo-*.ics) mv "$f" "$DEST/TODO.ics" ;;
        esac
      done
      bctl_git_commit "$DEST"
      log "Files → $DEST"
      BASH_SCRIPT

  # Ingest heredoc: extract the dropped archive, optionally derive a folder
  # suffix by running a shell command inside the extracted tree, rsync into
  # dest, git commit.
  - name: Example Cloud Export
    group: Social Media
    uploads: true
    glob: 'example-export-*.zip'
    state_dir: '{{backup_root}}/Example Cloud'
    summary_last_line: true
    export_url: https://example.com/settings/export
    note: Drop the example-export-*.zip file here.
    command: |
      bash <<'BASH_SCRIPT'
      source '{{lib}}'
      FILES=({{uploads}})
      tmp=$(mktemp -d -t bctl_ingest.XXXXXX)
      for f in "${FILES[@]}"; do
        log "Extracting $(basename "$f")..."
        bctl_extract "$f" "$tmp"
      done
      suffix=$(cd "$tmp" && cat account.json | jq -r ".username" 2>/dev/null) || true
      DEST='{{backup_root}}/Example Cloud'
      [[ -n "$suffix" ]] && DEST="$DEST - $suffix"
      mkdir -p "$DEST"
      bctl_rsync_delete --exclude .git/ "$tmp/" "$DEST"
      rm -rf "$tmp"
      bctl_git_commit "$DEST"
      log "Imported into $DEST"
      BASH_SCRIPT

  # encrypt subcommand: age-encrypt a dropped file with a prompted
  # passphrase. The passphrase travels in AGE_PASSPHRASE (env var, redacted
  # from the log, never on a command line); the generic pty runner
  # (`python -m backupctl.core`) feeds it to age, which refuses non-TTY
  # stdin.
  - name: Password Vault (encrypted)
    group: Apps & Accounts
    uploads: true
    glob: vault-export_*.json
    require: [password]
    state_dir: '{{backup_root}}/Vault'
    summary_last_line: true
    export_url: https://vault.example.com/#/tools/export
    prompts:
      - {key: password, label: 'Passphrase', type: secret}
    note: Drop the vault export here; you will be asked for a passphrase.
    command: "AGE_PASSPHRASE='{{password}}' bash '{{lib}}' encrypt '{{python}}' '{{backup_root}}/Vault' vault.json {{uploads}}"

  # Plain run: execute bash command(s) non-interactively. Output streams to
  # the log; nonzero exit fails the run; timeout kills hung commands.
  - name: File Server State Pull
    group: System Backups
    state_dir: '{{backup_root}}/Server State'
    commands:
      - '{{scriptroot}}/<infra repo>/<pull script>.sh pull {{hosts.fileserver.user}}@{{hosts.fileserver.host}}:{{hosts.fileserver.data_path}}'

  # run with uploads: drop files, then run a command with them appended
  # ({{uploads}} expands to the quoted uploaded paths; {{tmp}} is a unique
  # per-run temp path).
  - name: Chat Archive Merge
    group: Chats
    uploads: true
    glob: '*.zip'
    state_dir: '{{backup_root}}/Chat Archive'
    command: 'mkdir -p "{{backup_root}}/Chat Archive" && rm -rf "{{tmp}}" && mkdir -p "{{tmp}}" && unzip -oq {{uploads}} -d "{{tmp}}" && rm -f "{{tmp}}"/*.vcf && node {{chat_merge_script}} "{{backup_root}}/Chat Archive" "{{tmp}}"'
    note: Drop chat zips here; they are merged into the cumulative backup.

  # run with capture: the output is shown in a dialog for copy/pasting;
  # "Done" commits commit_dir to git.
  - name: Spreadsheet Transactions
    group: Finance
    capture: true
    state_dir: '{{backup_root}}/Documents/Finance'
    commit_dir: '{{backup_root}}/Documents/Finance'
    cwd: '{{balance_dir}}'
    commands:
      - 'npm i'
      - 'node {{balance_script}} "$(cat $(ls {{notes_dir}}/{{notes_glob}} | tail -1))" {{spreadsheet_xlsx}}'
    note: Paste the results into the spreadsheet, then press Done to commit.

  # copy subcommand: rsync a list of sources into dest (optionally
  # git-committed per source); --pre/--post run shell commands before/after.
  - name: Personal Config Files
    group: System Backups
    state_dir: '{{backup_root}}/Config Files'
    summary_last_line: true
    command: "bash '{{lib}}' copy --git --pre 'dconf dump /org/gnome/shell/extensions/ > ~/.local/share/gnome-shell/extensions/gnome-extension-settings.conf' --post 'rm ~/.local/share/gnome-shell/extensions/gnome-extension-settings.conf' '{{backup_root}}/Config Files' ~/.ssh ~/.bashrc.d"

  # Media import heredoc: for each pair, optionally run a pre script, delete
  # already-synced files, then standardize-and-move (originals deleted on
  # success); process:false pairs plain-move instead. `root:` is the
  # availability check (the card is disabled while the source is missing).
  - name: Device Media Import
    group: Devices
    root: '{{sync_dir}}'
    state_dir: '{{backup_root}}/Media'
    summary_last_line: true
    note: Imports and standardizes media from the synced device folders.
    command: |
      bash <<'BASH_SCRIPT'
      source '{{lib}}'
      SRC='{{sync_dir}}'
      import_pair() {
        local src="$1" dest="$2"
        if [[ ! -d "$src" ]]; then
          log "Missing source dir: $src"
          return 0
        fi
        bash '{{scriptroot}}/<media repo>/<delete-synced script>.sh' "$src" "$dest"
        log "Importing $(basename "$src") → $dest..."
        bctl_process_and_move "$src" "$dest" '{{scriptroot}}/<media repo>/<standardize script>.sh'
      }
      import_pair "$SRC/DCIM/Camera" '{{backup_root}}/Media/Camera'
      import_pair "$SRC/Screenshots" '{{backup_root}}/Media/Screenshots'
      DEST='{{backup_root}}/Media/Recordings'
      mkdir -p "$DEST"
      for f in "$SRC/Recordings"/*; do mv "$f" "$DEST/$(basename "$f")"; done
      log "Media import completed"
      BASH_SCRIPT

  # Archive-style media: snapshot the live folder first, rsync each subdir
  # raw into the staging dir, standardize the live copies (concatenating
  # segments per child dir for entries with a concat script), then delete
  # the originals — only because set -e aborts on any failure before the
  # final rm -rf. `require: [confirmed]` gates the deletion behind the
  # confirm prompt.
  - name: Chat App Archive
    group: Chats
    root: '{{backup_root}}/<chat app folder>/Media'
    require: [confirmed]
    state_dir: '{{backup_root}}/Archive/<Chat-AllMedia>'
    summary_last_line: true
    prompts:
      - {key: confirmed, label: 'Manually copy anything in the GIFs folder to the video folder, then press OK.', type: confirm}
    note: Archives the live chat folder, then standardizes media and deletes the originals on success.
    command: |
      bash <<'BASH_SCRIPT'
      source '{{lib}}'
      SRC='{{backup_root}}/<chat app folder>'
      MEDIA="$SRC/Media"
      OUT='{{media_staging_dir}}'
      ARCHIVE='{{backup_root}}/Archive/<Chat-AllMedia>'
      log "Snapshotting $SRC → $ARCHIVE..."
      mkdir -p "$ARCHIVE"
      bctl_rsync "$SRC/" "$ARCHIVE"
      src="$MEDIA/Chat Images"
      out="$OUT/Chat Images"
      mkdir -p "$out"
      bctl_rsync "$src/" "$out"
      for child in "$src"/*/; do
        [[ -d "$child" ]] || continue
        bctl_process_and_move "$child" "$out" '{{scriptroot}}/<media repo>/<standardize script>.sh' 1
      done
      src="$MEDIA/Chat Voice Notes"
      out="$OUT/Chat Voice Notes"
      mkdir -p "$out"
      bctl_rsync "$src/" "$out"
      for child in "$src"/*/; do
        [[ -d "$child" ]] || continue
        processed="$child/processed"
        mkdir -p "$processed"
        bash '{{scriptroot}}/<utils repo>/<concat audio script>.sh' "$child" "$processed"
        bash '{{scriptroot}}/<media repo>/<standardize script>.sh' "$processed"
        for f in "$processed"/*; do mv "$f" "$out/$(basename "$f")"; done
        rm -rf "$processed"
      done
      rm -rf "$MEDIA/Chat Images" "$MEDIA/Chat Voice Notes"
      log "Import completed; originals deleted"
      BASH_SCRIPT

  # Remote workflow as a plain command list: push a script over SSH, run it,
  # rsync the results back, clean up. Every step is rc-checked.
  - name: Game Save Files
    group: System Backups
    state_dir: '{{backup_root}}/Game Save Files'
    commands:
      - 'ssh -o BatchMode=yes {{hosts.gaming_pc.user}}@{{hosts.gaming_pc.host}} "mkdir -p /tmp/gamehomebak"'
      - 'rsync -aq -e "ssh -o BatchMode=yes" "{{scriptroot}}/<game saves repo>/<script>.sh" {{hosts.gaming_pc.user}}@{{hosts.gaming_pc.host}}:/tmp/gamehomebak/'
      - 'ssh -o BatchMode=yes {{hosts.gaming_pc.user}}@{{hosts.gaming_pc.host}} "cd /tmp/gamehomebak && bash ./<script>.sh ~/<games dir> /home/{{hosts.gaming_pc.user}}/Downloads/gamehomebak_out"'
      - 'rsync -aq -e "ssh -o BatchMode=yes" {{hosts.gaming_pc.user}}@{{hosts.gaming_pc.host}}:/home/{{hosts.gaming_pc.user}}/Downloads/gamehomebak_out/ "{{backup_root}}/Game Save Files"'
      - 'ssh -o BatchMode=yes {{hosts.gaming_pc.user}}@{{hosts.gaming_pc.host}} "rm -rf /tmp/gamehomebak /home/{{hosts.gaming_pc.user}}/Downloads/gamehomebak_out"'
    note: Runs the backup script on the gaming PC over SSH and pulls the results down.

  # run + tool + args + fresh_dir + prune: a service-specific CLI expressed
  # generically. `require` lists prompt keys that must have a value; `tool`
  # downloads and extracts the binary if missing (its path becomes
  # {{tool_binary}}); `args` runs as argv (no shell) and empty values drop
  # their flag pair (so -t {{totp}} vanishes without a code); `fresh_dir`
  # fails the run unless the newest export dir is non-empty and fresh;
  # `prune` deletes older export dirs (keep_newer keeps any larger than the
  # newest). Prompt secrets are redacted from the log.
  - name: Mail Export
    group: Tools
    timeout: 1800
    state_dir: '{{backup_root}}/Email'
    require: [password]
    tool:
      url: https://example.com/export-cli.tar.gz
      dir: ~/export-cli
      binary: ~/export-cli/export-cli
      extract: true
      chmod: true
    args:
      - '{{tool_binary}}'
      - -d
      - '{{backup_root}}/Email'
      - -u
      - '{{mail_email}}'
      - -p
      - '{{password}}'
      - -t
      - '{{totp}}'
    fresh_dir: '{{backup_root}}/Email/{{mail_email}}'
    prune:
      dir: '{{backup_root}}/Email/{{mail_email}}'
      keep_newer: true
    prompts:
      - {key: password, label: 'Password', type: secret}
      - {key: totp, label: 'TOTP code (if 2FA is enabled)', type: secret}
    note: Exports the mailbox. You will be asked for your password and TOTP code (if 2FA is enabled).
