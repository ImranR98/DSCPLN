# Example: run a few D$CPLN apps with Docker Compose.
#
# Every app is an independent container. Apps are configured either from the
# files mounted below or from their own web UI (Settings). When you put apps
# behind a reverse proxy on one host, set BASE_PATH=/<name> and mount them under
# subpaths; running each on its own port (as below) needs no BASE_PATH.
#
# The optional ./dscpln-config mounts point at a private config repo created
# from config-template/ (npm run init-config). Remove them to use each app's
# built-in defaults and Settings UI instead.
services:
  portal:
    image: imranrdev/dscpln-portal:latest
    ports:
      - "8080:8080"
    environment:
      APP: portal
      DSCPLN_CONFIG_FILE: /config/config.json
    volumes:
      - ./dscpln-config/apps/portal:/config

  balance-xlsx:
    image: imranrdev/dscpln-balance:latest
    ports:
      - "3300:3300"
    environment:
      APP: balance
      DSCPLN_CONFIG: /config/config.json
    volumes:
      - ./dscpln-config/apps/balance-xlsx:/config:ro
      # The workbook's git repository (Balance.xlsx + .git):
      - ./balance:/data
    # The template's workbookFile is /data/Balance.xlsx.

  file-pipelines:
    image: imranrdev/dscpln-file-pipelines:latest
    environment:
      APP: file-pipelines
    ports:
      - "8791:8791"
    volumes:
      # config.json (mounted from the config repo) and app state:
      - ./dscpln-config/apps/file-pipelines:/config
      - ./file-pipelines-data:/data
      # Your phone-sync folder and the media destination:
      - /path/to/phone-sync:/phone-sync:ro
      - /path/to/media:/media

  task-runner:
    image: imranrdev/dscpln-task-runner:latest
    ports:
      - "8085:8085"
    environment:
      APP: task-runner
      BACKUPCTL_CONFIG_FILE: /config-src/config.mjs
      BACKUPCTL_STATE_DIR: /data/state
      BACKUPCTL_TMP_DIR: /data/tmp
      BACKUPCTL_SCHEDULES: "1"
      DSCPLN_PORTAL_URL: http://portal:8080
    volumes:
      - ./dscpln-config:/config-src:ro
      - ./task-runner-data:/data
      # The tree your tasks operate on:
      - /path/to/data:/data/tree
