# Same-path mounts: host directories appear at identical paths inside the
# container, so the personal config.mjs works unmodified.
# Adjust the host paths (left side) to your setup.
services:
  backup:
    build: .
    user: "1000:1000"
    volumes:
      - /home/node/Main:/home/node/Main
      - /home/node/Downloads:/home/node/Downloads
      - /home/node/deviceSync:/home/node/deviceSync
      - /home/node/.ssh:/home/node/.ssh
      - /home/node/.gnupg:/home/node/.gnupg
      - ./config:/app/config
      - backupctl-state:/home/node/.backupctl
    expose:
      - "8080"
    networks:
      - proxy

volumes:
  backupctl-state:

networks:
  proxy:
    external: true
