[project]
name = "backupctl"
version = "2.1.0"
description = "Local web GUI for config-driven backup workflows"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pyyaml", "pexpect"]

[project.scripts]
backupctl = "backupctl.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backupctl*"]

[tool.setuptools.package-data]
backupctl = ["static/*"]
