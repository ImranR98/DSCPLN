<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monthly budget tracker">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
    <title>D$CPLN</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3E%24%3C/text%3E%3C/svg%3E">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('dscpln-theme') || 'auto'
                if (theme !== 'light' && theme !== 'dark' && theme !== 'auto') theme = 'auto'
                var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
                document.documentElement.dataset.theme = dark ? 'dark' : 'light'
            } catch (e) { }
        })()
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="is-loading">

    <header class="app-header">
        <div class="app-header__top">
            <h1>D<span class="accent">$</span>CPLN</h1>
            <div class="app-header__actions">
                <button id="refreshButton" class="icon-button" type="button" title="Refresh"
                    aria-label="Refresh data">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 11a8 8 0 1 0-2.34 5.66" />
                        <path d="M20 4v7h-7" />
                    </svg>
                </button>
                <button id="themeButton" class="icon-button" type="button" title="Theme: auto"
                    aria-label="Theme: auto. Click to change."></button>
            </div>
        </div>
        <div class="app-header__meta">
            <span id="contextLabel"></span>
            <span class="app-header__meta-tools">
                <span id="updatedLabel" class="muted"></span>
            </span>
        </div>
    </header>

    <div id="pretendBanner" class="banner" hidden>
        <span>Viewing as of <strong id="pretendBannerDate"></strong> — this is a simulation.</span>
        <button id="bannerTodayButton" class="button" type="button">Back to today</button>
    </div>

    <main>
        <section class="card" id="monthCard" aria-labelledby="monthHeading">
            <div class="card__header">
                <h2 id="monthHeading">Main</h2>
                <span class="card__header-tools">
                    <span id="monthName" class="card__context"></span>
                    <button id="primaryBudgetButton" class="icon-button icon-button--small" type="button"
                        title="Edit budget" aria-label="Edit budget">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9" />
                            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
                        </svg>
                    </button>
                </span>
            </div>
            <p class="figure">
                <span id="monthSpend" class="figure__spend">—</span>
                <span id="monthOf" class="figure__of">of</span>
                <span id="monthBudget" class="figure__budget">—</span>
            </p>
            <div class="progress" id="monthProgress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="0">
                <div class="progress__fill" id="monthProgressFill"></div>
            </div>
            <div class="card__stats">
                <span id="monthRemaining"></span>
                <span id="monthDaily"></span>
                <span id="monthPace" class="pace"></span>
            </div>
            <div class="mini-grid mini-grid--primary">
                <span class="mini-grid__label"></span>
                <span class="mini-grid__header">This month</span>
                <span class="mini-grid__header">Last month</span>
                <span class="mini-grid__header">12-mo avg</span>
                <span class="mini-grid__label">Spent</span>
                <span id="monthSpentThis" class="mini-grid__value"></span>
                <span id="monthSpentPrev" class="mini-grid__value"></span>
                <span id="monthSpentAvg" class="mini-grid__value"></span>
                <span class="mini-grid__label">Earned</span>
                <span id="monthEarnThis" class="mini-grid__value mini-grid__value--in"></span>
                <span id="monthEarnPrev" class="mini-grid__value mini-grid__value--in"></span>
                <span id="monthEarnAvg" class="mini-grid__value mini-grid__value--in"></span>
            </div>
        </section>

        <div id="otherCurrencies"></div>

        <details class="card" id="expensesCard" open>
            <summary>
                <span>This month</span>
                <span id="expensesMeta" class="muted"></span>
            </summary>
            <div class="expenses__actions">
                <button id="addTransactionButton" class="button button--primary" type="button" hidden>Add transaction</button>
            </div>
            <ul id="expensesList" class="expenses__list"></ul>
            <p id="expensesEmpty" class="muted" hidden>No transactions recorded this month.</p>
        </details>

        <section class="card" aria-labelledby="pretendHeading">
            <div class="card__header">
                <h2 id="pretendHeading">Pretend it's</h2>
            </div>
            <div class="controls__row">
                <input id="pretendDateInput" type="date" aria-label="Pretend date">
                <button id="pretendTodayButton" class="button" type="button">Today</button>
            </div>
        </section>
    </main>

    <dialog id="budgetDialog" class="dialog" aria-labelledby="budgetDialogTitle">
        <form id="budgetForm" novalidate>
            <h2 id="budgetDialogTitle">Edit budget</h2>
            <p id="budgetCurrencyNote" class="hint"></p>
            <label for="monthlyBudgetInput">Monthly budget</label>
            <input id="monthlyBudgetInput" name="monthlyBudget" type="number" step="0.01" min="0.01"
                inputmode="decimal" autocomplete="off" required>
            <label for="firstDayBiasInput">First day bias</label>
            <input id="firstDayBiasInput" name="firstDayBias" type="number" step="0.01" min="0"
                inputmode="decimal" autocomplete="off" required>
            <p class="hint">Extra amount assigned to the first day of the month.</p>
            <p id="budgetFormError" class="form-error" hidden></p>
            <div class="dialog__actions">
                <button id="budgetCancelButton" class="button" type="button">Cancel</button>
                <button id="budgetSaveButton" class="button button--primary" type="submit">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="transactionDialog" class="dialog" aria-labelledby="transactionDialogTitle">
        <form id="transactionForm">
            <h2 id="transactionDialogTitle">Add transaction</h2>
            <div class="segmented" role="radiogroup" aria-label="Transaction kind">
                <label class="segmented__option">
                    <input type="radio" name="kind" value="expense" checked>
                    <span>Expense</span>
                </label>
                <label class="segmented__option">
                    <input type="radio" name="kind" value="income">
                    <span>Income</span>
                </label>
            </div>
            <label for="transactionAmountInput">Amount</label>
            <input id="transactionAmountInput" name="amount" type="number" step="0.01" min="0.01"
                inputmode="decimal" autocomplete="off" required>
            <label for="transactionDetailsInput">Details</label>
            <input id="transactionDetailsInput" name="details" type="text" autocomplete="off" required>
            <label for="transactionDateInput">Date</label>
            <input id="transactionDateInput" name="date" type="date" required>
            <label for="transactionCategorySelect">Category</label>
            <select id="transactionCategorySelect" name="category" required></select>
            <p id="transactionCategoryHint" class="hint" hidden></p>
            <label for="transactionCurrencySelect">Currency</label>
            <select id="transactionCurrencySelect" name="currency" required></select>
            <label for="transactionNotesInput">Notes <span class="label-optional">(optional)</span></label>
            <input id="transactionNotesInput" name="notes" type="text" autocomplete="off">
            <p id="transactionFormError" class="form-error" hidden></p>
            <div class="dialog__actions">
                <button id="transactionCancelButton" class="button" type="button">Cancel</button>
                <button id="transactionSaveButton" class="button button--primary" type="submit">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="deleteDialog" class="dialog" aria-labelledby="deleteDialogTitle">
        <div class="dialog__content">
            <h2 id="deleteDialogTitle">Delete transaction</h2>
            <p id="deleteDialogText" class="muted"></p>
            <p id="deleteDialogError" class="form-error" hidden></p>
            <div class="dialog__actions">
                <button id="deleteCancelButton" class="button" type="button">Cancel</button>
                <button id="deleteConfirmButton" class="button button--danger" type="button">Delete</button>
            </div>
        </div>
    </dialog>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <script src="app.js"></script>
</body>

</html>
