<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Spending insights">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
    <title>D$CPLN Insights</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3E%24%3C/text%3E%3C/svg%3E">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('dscpln-theme') || 'auto'
                if (theme !== 'light' && theme !== 'dark' && theme !== 'auto') theme = 'auto'
                var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
                document.documentElement.dataset.theme = dark ? 'dark' : 'light'
            } catch (e) { }
        })()
    </script>
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>

<body class="is-loading">

    <header class="app-header">
        <div class="app-header__top">
            <h1><a class="app-header__brand" href="/">D<span class="accent">$</span>CPLN</a></h1>
            <div class="app-header__actions">
                <a class="button button--small" href="/">Dashboard</a>
                <button id="themeButton" class="icon-button" type="button" title="Theme: auto"
                    aria-label="Theme: auto. Click to change."></button>
            </div>
        </div>
        <div class="app-header__meta">
            <span>Insights</span>
            <span class="app-header__meta-tools">
                <span id="rangeLabel" class="muted"></span>
            </span>
        </div>
    </header>

    <main class="insights">
        <section class="card insights-filters" aria-label="Date range">
            <div class="filters">
                <label class="field">
                    <span class="field__label">Start</span>
                    <input id="startDate" type="date" required>
                </label>
                <label class="field">
                    <span class="field__label">End</span>
                    <input id="endDate" type="date" required>
                </label>
                <label class="field">
                    <span class="field__label">Month</span>
                    <input id="monthPicker" type="month">
                </label>
            </div>
            <div class="quick-ranges" role="group" aria-label="Quick ranges">
                <button class="chip" type="button" data-range="this-month">This month</button>
                <button class="chip" type="button" data-range="last-month">Last month</button>
                <button class="chip" type="button" data-range="last-3">Last 3 months</button>
                <button class="chip" type="button" data-range="last-6">Last 6 months</button>
                <button class="chip" type="button" data-range="last-12">Last 12 months</button>
                <button class="chip" type="button" data-range="ytd">Year to date</button>
            </div>
        </section>

        <div id="insightsContent"></div>
    </main>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <script src="format.js"></script>
    <script src="insightsMath.js"></script>
    <script src="insights.js"></script>
</body>

</html>
