<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="D$CPLN API settings">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
    <title>D$CPLN Settings</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3E%24%3C/text%3E%3C/svg%3E">
    <script src="theme-boot.js"></script>
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>

<body class="is-loading">

    <header class="app-header">
        <div class="app-header__top">
            <h1><a class="app-header__brand" href="/">D<span class="accent">$</span>CPLN</a></h1>
            <div class="app-header__actions">
                <a class="button button--small" href="/">Dashboard</a>
                <button id="themeButton" class="icon-button" type="button" title="Theme: auto"
                    aria-label="Theme: auto. Click to change."></button>
            </div>
        </div>
        <div class="app-header__meta">
            <span>API settings</span>
        </div>
    </header>

    <main>
        <section class="card">
            <div class="card__header">
                <h2>API token</h2>
            </div>
            <p class="hint">
                Send this token as <code>Authorization: Bearer &lt;token&gt;</code> when calling
                <code>/api/transactions</code>. Regenerating invalidates the old token immediately.
            </p>
            <div class="token-row">
                <input id="apiTokenInput" type="text" readonly spellcheck="false" aria-label="API token">
                <button id="copyTokenButton" class="button" type="button">Copy</button>
                <button id="regenerateTokenButton" class="button button--danger" type="button">Regenerate</button>
            </div>
            <pre id="apiExample" class="code-block"></pre>
        </section>
    </main>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <script src="core.js"></script>
    <script src="settings.js"></script>
</body>

</html>
